name: Sync Submodules

on:
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab
  schedule:
    - cron: '0 0 * * *' # Auto-check once daily

jobs:
  sync:
    name: Update Submodules
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Submodule Updates
        run: |
          git submodule update --remote --merge

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add .
            git commit -m "chore(submodules): auto-sync submodules to latest commits"
            git push origin main
            echo "Submodules updated and pushed."
          else
            echo "All submodules are already up to date."
          fi
